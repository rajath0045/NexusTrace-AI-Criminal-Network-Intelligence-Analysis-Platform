name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexustrace
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexustrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexustrace -d nexustrace"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://nexustrace:ci-only-password@127.0.0.1:5432/nexustrace?schema=public
      EVIDENCE_STORAGE_ROOT: .data/ci-evidence
      APP_ORIGIN: http://localhost:3000
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm prisma validate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
